# Runs the whole check (`npm run check -- --all`: build, made tables, the repo's rules, every test) on every push and
# pull request, on Linux; and on macOS the check of the areas whose tests differ there: a plan writer's read-only mount,
# made with `sandbox-exec` (plan_sandbox, its real_programs_ test refuses a write into the guarded folders for real;
# plan_steps, macOS's own words when it cannot be made), a process's state read with `ps` (detached_jobs), locks taken
# with the kernel's flock, macOS having no `flock` command (home_folder_more), `wc`'s padded count (finish_commit), a temp
# folder whose path is a link (warm_start: /var is /private/var), a copied program that may need signing again
# (take_over_more), and a machine name too long to show whole (the runners' own: coordinator_levels,
# board_coordinators_inks). The whole check passed there once too, on the commit that brought these.
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-

      - name: The check
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: npm run check -- --all

      # Keep the generator's output available without requiring a local build.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-settings
          path: docs/settings.md
          if-no-files-found: error

  macos-release:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # PR artifacts must identify the real head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-release-

      - name: Build the macOS aarch64 release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package, verify architecture and smoke-test the version
        env:
          HERDR_PROJECTS_INLINE: "1"
          HERDR_PROJECTS_HOME: ${{ runner.temp }}/hc-runtime-smoke
        run: |
          mkdir dist
          cp target/aarch64-apple-darwin/release/herdr-projects dist/herdr-projects-macos-aarch64
          file dist/herdr-projects-macos-aarch64 | tee /dev/stderr | grep -q 'Mach-O.*arm64'
          dist/herdr-projects-macos-aarch64 version | tee dist/VERSION.txt
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          grep -q "^herdr-projects $version " dist/VERSION.txt
          git rev-parse HEAD > dist/SOURCE_REVISION.txt
          cd dist
          shasum -a 256 herdr-projects-macos-aarch64 > herdr-projects-macos-aarch64.sha256
          shasum -a 256 -c herdr-projects-macos-aarch64.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: herdr-projects-macos-aarch64
          path: dist/*
          if-no-files-found: error

  macos:
    # macos-14 jobs are rejected by GitHub before execution; keep the sandbox gate on a supported image.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache the build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ runner.os }}-

      - name: The areas that differ on macOS
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: npm run check plan-sandbox plan-steps detached-jobs home-folder-more finish-commit warm-start take-over-more coordinator-levels board-coordinators-inks
